<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <!-- Status bar and navigation bar colour. app.js keeps these in step with the palette. -->
    <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="fonts/GoogleSansFlex-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calc" id="calc">
      <div class="safe-probe" id="safeProbe" aria-hidden="true"></div>

      <!-- Top left: history. A tap saves the number on screen as the force number. The
           minute hand is the tell. -->
      <button class="icon-btn" id="historyBtn" type="button" aria-label="History">
        <svg viewBox="0 -960 960 960" aria-hidden="true">
          <path fill="currentColor" d="M480-120q-138 0-240.5-91.5T122-440h82q14 104 92.5 172T480-200q117 0 198.5-81.5T760-480q0-117-81.5-198.5T480-760q-69 0-129 32t-101 88h110v80H120v-240h80v94q51-64 124.5-99T480-840q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-480q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-120Z" />
          <polyline id="hands" points="480,-680 480,-480 620,-340" fill="none" stroke="currentColor" stroke-width="80" stroke-linejoin="miter" stroke-miterlimit="4" />
        </svg>
      </button>

      <!-- Top right: overflow menu. Tap for the menu, hold for the date and time force. -->
      <button class="icon-btn" id="menuBtn" type="button" aria-label="More options">
        <svg viewBox="0 -960 960 960" aria-hidden="true">
          <path fill="currentColor" d="M480-160q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm0-240q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-240q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Z" />
        </svg>
      </button>

      <div class="display" id="display">
        <div class="formula-box" id="formulaBox"><span class="formula" id="formula"></span><span class="cursor" id="cursor"></span></div>
        <div class="preview-box" id="previewBox"><span class="preview" id="preview"></span></div>
      </div>

      <!-- Expands the scientific keys. Hold it to open the colour setup. -->
      <button class="icon-btn chevron" id="chevron" type="button" aria-label="Expand">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline id="chevTop" points="8,8 12,4 16,8" />
          <polyline id="chevBottom" points="8,16 12,20 16,16" />
        </svg>
      </button>

      <div class="keys" id="keys"></div>

      <!-- Overflow menu, as in the real app. Only Clear history and Choose theme do anything. -->
      <div class="scrim" id="menuScrim" hidden></div>
      <div class="menu" id="menu" hidden>
        <button type="button" data-menu="clear"><svg viewBox="0 -960 960 960"><path fill="currentColor" d="M120-40v-280q0-83 58.5-141.5T320-520h40v-320q0-33 23.5-56.5T440-920h80q33 0 56.5 23.5T600-840v320h40q83 0 141.5 58.5T840-320v280H120Zm80-80h80v-120q0-17 11.5-28.5T320-280q17 0 28.5 11.5T360-240v120h80v-120q0-17 11.5-28.5T480-280q17 0 28.5 11.5T520-240v120h80v-120q0-17 11.5-28.5T640-280q17 0 28.5 11.5T680-240v120h80v-200q0-50-35-85t-85-35H320q-50 0-85 35t-35 85v200Z"/></svg><span>Clear history</span></button>
        <button type="button" data-menu="theme"><svg viewBox="0 -960 960 960"><path fill="currentColor" d="M480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 32.5-156t88-127Q256-817 330-848.5T488-880q80 0 151 27.5t124.5 76q53.5 48.5 85 115T880-518q0 115-70 176.5T640-280h-74q-9 0-12.5 5t-3.5 11q0 12 15 34.5t15 51.5q0 50-27.5 74T480-80ZM303-457q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm120-160q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm200 0q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm120 160q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Z"/></svg><span>Choose theme</span></button>
        <button type="button" data-menu="none"><svg viewBox="0 -960 960 960"><path fill="currentColor" d="M579-481q41-41 41-99t-41-99q-41-41-99-41t-99 41q-41 41-41 99t41 99q41 41 99 41t99-41ZM480-80q-146-37-233-160t-87-276v-244l320-120 320 120v244q0 153-87 276T480-80Zm0-84q59-19 104.5-59.5T664-315q-43-22-89.5-33.5T480-360q-48 0-94.5 11.5T296-315q34 51 79.5 91.5T480-164Z"/></svg><span>Privacy policy</span></button>
        <button type="button" data-menu="none"><svg viewBox="0 -960 960 960"><path fill="currentColor" d="M480-120q-65 0-120.5-32T272-240H160v-80h84q-3-20-3.5-40t-.5-40h-80v-80h80q0-20 .5-40t3.5-40h-84v-80h112q14-23 31.5-43t40.5-35l-64-66 56-56 86 86q28-9 57-9t57 9l88-86 56 56-66 66q23 15 41.5 34.5T688-640h112v80h-84q3 20 3.5 40t.5 40h80v80h-80q0 20-.5 40t-3.5 40h84v80H688q-32 56-87.5 88T480-120Zm-80-200h160v-80H400v80Zm0-160h160v-80H400v80Z"/></svg><span>Send feedback</span></button>
        <button type="button" data-menu="none"><svg viewBox="0 -960 960 960"><path fill="currentColor" d="M513.5-254.5Q528-269 528-290t-14.5-35.5Q499-340 478-340t-35.5 14.5Q428-311 428-290t14.5 35.5Q457-240 478-240t35.5-14.5ZM442-394h74q0-33 7.5-52t42.5-52q26-26 41-49.5t15-56.5q0-56-41-86t-97-30q-57 0-92.5 30T342-618l66 26q5-18 22.5-39t53.5-21q32 0 48 17.5t16 38.5q0 20-12 37.5T506-526q-44 39-54 59t-10 73Zm38 314q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/></svg><span>Help</span></button>
      </div>

      <div class="scrim dim" id="dialogScrim" hidden></div>
      <div class="dialog" id="themeDialog" hidden>
        <h2>Choose theme</h2>
        <label><input type="radio" name="theme" value="light" /><span>Light</span></label>
        <label><input type="radio" name="theme" value="dark" /><span>Dark</span></label>
        <label><input type="radio" name="theme" value="system" /><span>System default</span></label>
        <div class="dialog-actions">
          <button type="button" id="themeCancel">Cancel</button>
          <button type="button" id="themeOk">OK</button>
        </div>
      </div>

      <!-- History, pulled down from the display. -->
      <div class="history" id="history" hidden>
        <div class="history-list" id="historyList"></div>
        <div class="history-handle" id="historyHandle"><span></span></div>
      </div>

      <!-- Secret colour setup (hold the chevron). -->
      <div class="setup" id="setup" hidden>
        <h2>Match your phone</h2>
        <p>On your phone, open the real Calculator, clear it, and take a screenshot. Do it once in dark mode and once in light mode, then pick each screenshot here. The keys, background and text take their colours from it.</p>
        <div class="setup-row" data-scheme="dark">
          <div class="swatches"></div>
          <div class="setup-buttons">
            <label class="setup-btn">Dark screenshot<input type="file" accept="image/*" /></label>
            <button type="button" class="setup-btn subtle" data-reset>Default</button>
          </div>
        </div>
        <div class="setup-row" data-scheme="light">
          <div class="swatches"></div>
          <div class="setup-buttons">
            <label class="setup-btn">Light screenshot<input type="file" accept="image/*" /></label>
            <button type="button" class="setup-btn subtle" data-reset>Default</button>
          </div>
        </div>
        <p class="setup-note" id="setupNote"></p>
        <button type="button" class="setup-btn done" id="setupDone">Done</button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
